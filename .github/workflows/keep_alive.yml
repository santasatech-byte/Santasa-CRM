name: Keep Supabase Active 24/7

on:
  schedule:
    # Runs every 2 days at 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, psycopg2
          db_url = os.getenv('DATABASE_URL')
          if db_url:
              conn = psycopg2.connect(db_url)
              cur = conn.cursor()
              cur.execute('SELECT 1;')
              print('Supabase heartbeat OK:', cur.fetchone())
              conn.close()
          else:
              print('DATABASE_URL not set in GitHub secrets. Set repository secret DATABASE_URL to enable auto-ping.')
          "
