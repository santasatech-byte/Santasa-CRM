[project]
name = "santasa-crm"
version = "1.0.0"
description = "Santasa IVF Hospital Lead & Follow-up CRM API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
    "email-validator>=2.1.0",
    "requests>=2.31.0"
]

[tool.vercel]
entrypoint = "hospital_crm.backend.app.main:app"
